project:
  type: website
  output-dir: _site
  resources:
    - "assets/**"
    - "files/**"

website:
  title: "Sandip Dayani"
  description: "Physics-based micromechanical modeling, constitutive development, and multiscale validation for failure prediction in advanced high-strength steels."
  site-url: "https://sandipdayani.github.io"
  repo-url: "https://github.com/sandipdayani/sandipdayani.github.io"
  favicon: assets/img/profile.png
  open-graph: true
  twitter-card: true

  page-navigation: false
  back-to-top-navigation: true
  search: false

  navbar:
    background: light
    pinned: true
    collapse-below: lg
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: cv.qmd
        text: CV
      - href: news.qmd
        text: News
    right:
      - icon: envelope
        href: "mailto:sandip.dayani09@gmail.com"
        aria-label: Email
      - icon: linkedin
        href: "https://www.linkedin.com/in/sandip-dayani/"
        aria-label: LinkedIn
      - icon: mortarboard
        href: "https://scholar.google.ca/citations?user=zI0fpEwAAAAJ"
        aria-label: Google Scholar
      - icon: github
        href: "https://github.com/sandipdayani"
        aria-label: GitHub

  page-footer:
    background: light
    left: "© 2026 Sandip Dayani"
    right: "Computational mechanics · Crystal plasticity · Steel failure"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    css: styles.css
    toc: false
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    grid:
      body-width: 1040px
      sidebar-width: 280px
      margin-width: 220px

execute:
  freeze: auto
